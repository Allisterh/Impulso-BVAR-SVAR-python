<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Impulso mark: an impulse response with its 68% and 90% credible bands,
       paper on a brand-oxblood tile, after the Impulso figure on the
       quantclimate.com landing page. The response rises off the zero line
       and decays out past the tile's right edge. The zero line sits on whole
       pixels at 16px and 32px. favicon.ico and apple-touch-icon.png are
       rasterised from this file; see html_favicon in docs/conf.py. -->
  <clipPath id="tile"><rect width="32" height="32" rx="7"/></clipPath>
  <rect width="32" height="32" rx="7" fill="#7a2e2a"/>
  <g clip-path="url(#tile)">
    <g fill="#faf9f7">
      <path fill-opacity=".18" d="M5 25C6.5 24.6 8.1 4 13 3.9C15.2 3.9 18.7 10.8 20 12.8C23.4 18.1 26.7 21.5 33 22.8L33 25.8C27.9 25.4 24.3 24.4 20 21.7C18.2 20.5 15.1 18.1 13 18.1C8.9 18.1 6.4 24.9 5 25Z"/>
      <path fill-opacity=".28" d="M5 25C6.5 24.7 8.1 7.6 13 7.6C15.1 7.6 18.6 13.3 20 15.1C23.7 19.9 27 22.5 33 23.6L33 25C27.6 24.4 24.1 23 20 19.4C18.3 17.9 15.1 14.4 13 14.4C8.5 14.4 6.4 24.8 5 25Z"/>
    </g>
    <g fill="none" stroke="#faf9f7" stroke-linecap="round">
      <path stroke-opacity=".5" stroke-width="2" d="M5 25H33"/>
      <path stroke-width="2.6" d="M5 25C6.4 24.7 8.3 11 13 11C15.1 11 18.5 15.6 20 17.2C23.9 21.5 27.3 23.4 33 24.3"/>
    </g>
  </g>
</svg>
